<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Coming Soon — WebSec Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A;
    --surface:#11162A;
    --surface-2:#161B33;
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.06);
    --text:#F1F2F6;
    --text-muted:#8B93A8;
    --brand-1:#6366F1;
    --brand-2:#A855F7;
    --red:#F43F5E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  
  /* Navbar */
  .navbar-full {
    display: flex;
    align-items: center;
    padding: 1.5rem 2rem;
    gap: 1rem;
    width: 100%;
    flex: none;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    text-decoration: none;
    color: inherit;
  }
  .navbar-brand .icon {
    width: 24px;
    height: 24px;
    color: var(--brand-1);
    stroke-width: 1.8;
  }
  .navbar-brand .hub {
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .navbar-tagline {
    font-size: 0.85rem;
    color: var(--text-muted);
    border-left: 1px solid var(--border);
    padding-left: 1rem;
    letter-spacing: 0.02em;
  }

  /* Main Coming Soon Content */
  .coming-soon-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    position: relative;
  }
  
  /* Background glow */
  .glow-bg {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, color-mix(in srgb, var(--brand-1) 15%, transparent) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  .content-inner {
    position: relative;
    z-index: 1;
    max-width: 500px;
  }

  /* Animated Icon */
  .cs-icon-container {
    width: 90px;
    height: 90px;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--brand-2);
    animation: floating 3s ease-in-out infinite;
    box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--brand-2) 30%, transparent);
  }
  .cs-icon-container svg {
    width: 42px;
    height: 42px;
    stroke-width: 1.5;
  }
  
  @keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.2;
    margin-bottom: 1rem;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
  }
  
  p.desc {
    color: var(--text-muted);
    font-size: 1rem;
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }

  /* Back Button */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
    text-decoration: none;
    padding: 0.85rem 1.75rem;
    border-radius: 10px;
    transition: filter 0.15s, transform 0.15s;
  }
  .back-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
  }
  .back-btn svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.2;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Footer */
  .footer-note{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:0.4rem;
    text-align:center;
    color:var(--text-muted);
    font-size:0.9rem;
    padding-bottom:2rem;
    flex: none;
  }
  .heart-icon{
    color:var(--red);
    display:inline-block;
    animation:heartbeat 1.5s infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .dev-name{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    background:linear-gradient(90deg, #3B82F6, #A855F7, #F43F5E, #F59E0B, #3B82F6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:gradient-flow 4s linear infinite;
  }
  @keyframes gradient-flow {
    0% { background-position:0% center; }
    100% { background-position:200% center; }
  }

  /* ---------- DYNAMIC CYBER BACKGROUND ---------- */
  .cyber-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* Matrix Dot Grid Overlay with continuous slow drift */
  .cyber-grid {
    position: absolute;
    inset: -120px;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.12) 1.2px, transparent 1.2px),
      linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
    background-size: 32px 32px, 96px 96px, 96px 96px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    opacity: 0.85;
    animation: gridDrift 60s linear infinite;
  }

  @keyframes gridDrift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(96px, 96px); }
  }

  /* Ambient Glowing Floating Orbs */
  .cyber-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.38;
    will-change: transform;
  }

  .orb-1 {
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, #6366f1 0%, rgba(99,102,241,0) 70%);
    top: -120px;
    left: -100px;
    animation: floatOrb1 16s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, #a855f7 0%, rgba(168,85,247,0) 70%);
    top: 15%;
    right: -150px;
    animation: floatOrb2 20s ease-in-out infinite alternate;
  }

  .orb-3 {
    width: 560px;
    height: 560px;
    background: radial-gradient(circle, #06b6d4 0%, rgba(6,182,212,0) 70%);
    bottom: -80px;
    left: 15%;
    animation: floatOrb3 18s ease-in-out infinite alternate;
  }

  .orb-4 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #f43f5e 0%, rgba(244,63,94,0) 70%);
    bottom: 18%;
    right: 12%;
    animation: floatOrb4 22s ease-in-out infinite alternate;
  }

  /* Keyframe Animations for Smooth Floating */
  @keyframes floatOrb1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(120px, 90px) scale(1.15); }
    100% { transform: translate(-60px, 140px) scale(0.92); }
  }

  @keyframes floatOrb2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-140px, 110px) scale(1.18); }
    100% { transform: translate(-80px, -70px) scale(0.9); }
  }

  @keyframes floatOrb3 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(90px, -100px) scale(1.14); }
    100% { transform: translate(-100px, -50px) scale(1.05); }
  }

  @keyframes floatOrb4 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-110px, -80px) scale(1.2); }
    100% { transform: translate(90px, 70px) scale(0.9); }
  }

  /* Floating Cyber Data Particles */
  .cyber-particle {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px currentColor;
    opacity: 0;
    animation: floatParticle 14s infinite ease-in-out;
  }

  .p-1 { width: 3px; height: 3px; left: 12%; bottom: -20px; color: var(--brand-1); animation-delay: 0s; animation-duration: 15s; }
  .p-2 { width: 4px; height: 4px; left: 28%; bottom: -20px; color: var(--brand-2); animation-delay: 3s; animation-duration: 18s; }
  .p-3 { width: 3px; height: 3px; left: 48%; bottom: -20px; color: var(--teal); animation-delay: 6s; animation-duration: 14s; }
  .p-4 { width: 4px; height: 4px; left: 68%; bottom: -20px; color: var(--red); animation-delay: 2s; animation-duration: 20s; }
  .p-5 { width: 3px; height: 3px; left: 84%; bottom: -20px; color: var(--amber); animation-delay: 7s; animation-duration: 16s; }
  .p-6 { width: 4px; height: 4px; left: 94%; bottom: -20px; color: var(--blue); animation-delay: 4s; animation-duration: 19s; }
  .p-7 { width: 3px; height: 3px; left: 38%; bottom: -20px; color: var(--green); animation-delay: 9s; animation-duration: 17s; }
  .p-8 { width: 4px; height: 4px; left: 58%; bottom: -20px; color: var(--purple); animation-delay: 11s; animation-duration: 21s; }

  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
    15% { opacity: 0.8; }
    85% { opacity: 0.8; }
    100% { transform: translateY(-105vh) translateX(50px) scale(1.2); opacity: 0; }
  }

  /* Scanline sweep effect */
  .cyber-scanline {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(99, 102, 241, 0.04) 50%, transparent 100%);
    background-size: 100% 200%;
    animation: scanSweep 12s linear infinite;
  }

  @keyframes scanSweep {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 200%; }
  }

  @media (max-width:640px){
    .navbar-full {flex-direction:column; align-items:flex-start; gap:0.5rem;}
    .navbar-tagline {border-left:none; padding-left:0; border-top:1px solid var(--border); padding-top:0.5rem;}
  }
</style>
</head>
<body>

<!-- ================= DYNAMIC CYBER BACKGROUND ================= -->
<div class="cyber-bg" aria-hidden="true">
  <div class="cyber-orb orb-1"></div>
  <div class="cyber-orb orb-2"></div>
  <div class="cyber-orb orb-3"></div>
  <div class="cyber-orb orb-4"></div>
  <div class="cyber-grid"></div>
  <div class="cyber-scanline"></div>
  <div class="cyber-particle p-1"></div>
  <div class="cyber-particle p-2"></div>
  <div class="cyber-particle p-3"></div>
  <div class="cyber-particle p-4"></div>
  <div class="cyber-particle p-5"></div>
  <div class="cyber-particle p-6"></div>
  <div class="cyber-particle p-7"></div>
  <div class="cyber-particle p-8"></div>
</div>

<header class="navbar-full">
  <a href="index.html" class="navbar-brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V5z"/><rect x="9" y="10" width="6" height="5" rx="1"/><path d="M10.3 10V8.5a1.7 1.7 0 0 1 3.4 0V10"/></svg>
    <span>WebSec <span class="hub">Hub</span></span>
  </a>
  <div class="navbar-tagline">Learn. Test. Secure.</div>
</header>

<main class="coming-soon-wrapper">
  
  
  <div class="content-inner">
    <div class="cs-icon-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    
    <h1><span class="grad">Work in Progress</span></h1>
    <p class="desc">This section is currently under development. Awesome new content is on the way, so please check back soon!</p>
    
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Return to Home
    </a>
  </div>
</main>

<div class="footer-note">
  Designed and developed by <span class="dev-name">Irshad Akaram</span>
</div>

</body>
</html>
