<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field-Wise WAPT Testing Checklist — Functional Component Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>

  :root[data-theme="dark"], :root, html[data-theme="dark"] {
    --bg: #0A0E1A;
    --panel: #11162A;
    --panel-2: #161B33;
    --border: rgba(255, 255, 255, 0.08);
    --border-light: rgba(255, 255, 255, 0.06);
    --text: #F1F2F6;
    --text-muted: #8B93A8;
    --text-faint: #5C6478;
    --brand-1: #6366F1;
    --brand-2: #A855F7;
    --danger: #F43F5E;
    --danger-bg: rgba(244, 63, 94, 0.12);
    --safe: #22C55E;
    --safe-bg: rgba(34, 197, 94, 0.12);
    --accent: #FFC857;
    --accent-bg: rgba(255, 200, 87, 0.14);
    --accent-2: #14B8A6;
    --accent-2-bg: rgba(20, 184, 166, 0.12);
    --blue: #3B82F6;
    --radius: 12px;
    --radius-sm: 8px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --glow: rgba(99, 102, 241, 0.08);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"], html[data-theme="light"] {
    --bg: #F4F7FB;
    --panel: #FFFFFF;
    --panel-2: #E8EEF5;
    --border: #D1D9E6;
    --border-light: rgba(0, 0, 0, 0.06);
    --text: #0F172A;
    --text-muted: #475569;
    --text-faint: #94A3B8;
    --danger: #E11D48;
    --danger-bg: rgba(225, 29, 72, 0.12);
    --safe: #059669;
    --safe-bg: rgba(5, 150, 105, 0.12);
    --accent: #D97706;
    --accent-bg: rgba(217, 119, 6, 0.14);
    --accent-2: #0E7490;
    --accent-2-bg: rgba(14, 116, 144, 0.12);
    --blue: #2563EB;
    --glow: rgba(77, 158, 255, 0.05);
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  ::selection { background: var(--accent-bg); color: var(--accent); }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; outline: none; }
  button:focus-visible, input:focus-visible, .step-header:focus-visible, .phase-pill:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── DYNAMIC CYBER BACKGROUND (Exact match to index.html) ── */
  .cyber-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* Matrix Dot Grid Overlay with continuous slow drift */
  .cyber-grid {
    position: absolute;
    inset: -120px;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.12) 1.2px, transparent 1.2px),
      linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
    background-size: 32px 32px, 96px 96px, 96px 96px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    opacity: 0.85;
    animation: gridDrift 60s linear infinite;
  }
  html[data-theme="light"] .cyber-grid {
    background-image: 
      radial-gradient(rgba(15, 23, 42, 0.08) 1.2px, transparent 1.2px),
      linear-gradient(rgba(99, 102, 241, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.02) 1px, transparent 1px);
    opacity: 0.5;
  }

  @keyframes gridDrift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(96px, 96px); }
  }

  /* Ambient Glowing Floating Orbs */
  .cyber-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.38;
    will-change: transform;
  }
  html[data-theme="light"] .cyber-orb {
    opacity: 0.15;
  }

  .orb-1 {
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, #6366f1 0%, rgba(99,102,241,0) 70%);
    top: -120px;
    left: -100px;
    animation: floatOrb1 16s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, #a855f7 0%, rgba(168,85,247,0) 70%);
    top: 15%;
    right: -150px;
    animation: floatOrb2 20s ease-in-out infinite alternate;
  }

  .orb-3 {
    width: 560px;
    height: 560px;
    background: radial-gradient(circle, #06b6d4 0%, rgba(6,182,212,0) 70%);
    bottom: -80px;
    left: 15%;
    animation: floatOrb3 18s ease-in-out infinite alternate;
  }

  .orb-4 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #f43f5e 0%, rgba(244,63,94,0) 70%);
    bottom: 18%;
    right: 12%;
    animation: floatOrb4 22s ease-in-out infinite alternate;
  }

  /* Keyframe Animations for Smooth Floating */
  @keyframes floatOrb1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(120px, 90px) scale(1.15); }
    100% { transform: translate(-60px, 140px) scale(0.92); }
  }

  @keyframes floatOrb2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-140px, 110px) scale(1.18); }
    100% { transform: translate(-80px, -70px) scale(0.9); }
  }

  @keyframes floatOrb3 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(90px, -100px) scale(1.14); }
    100% { transform: translate(-100px, -50px) scale(1.05); }
  }

  @keyframes floatOrb4 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-110px, -80px) scale(1.2); }
    100% { transform: translate(90px, 70px) scale(0.9); }
  }

  /* Floating Cyber Data Particles */
  .cyber-particle {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px currentColor;
    opacity: 0;
    animation: floatParticle 14s infinite ease-in-out;
  }

  .p-1 { width: 3px; height: 3px; left: 12%; bottom: -20px; color: #6366F1; animation-delay: 0s; animation-duration: 15s; }
  .p-2 { width: 4px; height: 4px; left: 28%; bottom: -20px; color: #A855F7; animation-delay: 3s; animation-duration: 18s; }
  .p-3 { width: 3px; height: 3px; left: 48%; bottom: -20px; color: #14B8A6; animation-delay: 6s; animation-duration: 14s; }
  .p-4 { width: 4px; height: 4px; left: 68%; bottom: -20px; color: #F43F5E; animation-delay: 2s; animation-duration: 20s; }
  .p-5 { width: 3px; height: 3px; left: 84%; bottom: -20px; color: #F59E0B; animation-delay: 7s; animation-duration: 16s; }
  .p-6 { width: 4px; height: 4px; left: 94%; bottom: -20px; color: #3B82F6; animation-delay: 4s; animation-duration: 19s; }
  .p-7 { width: 3px; height: 3px; left: 38%; bottom: -20px; color: #22C55E; animation-delay: 9s; animation-duration: 17s; }
  .p-8 { width: 4px; height: 4px; left: 58%; bottom: -20px; color: #A855F7; animation-delay: 11s; animation-duration: 21s; }

  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
    15% { opacity: 0.8; }
    85% { opacity: 0.8; }
    100% { transform: translateY(-105vh) translateX(50px) scale(1.2); opacity: 0; }
  }

  /* Scanline sweep effect */
  .cyber-scanline {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(99, 102, 241, 0.04) 50%, transparent 100%);
    background-size: 100% 200%;
    animation: scanSweep 12s linear infinite;
  }

  @keyframes scanSweep {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 200%; }
  }

  /* ── STICKY HEADER WRAPPER (Topbar + Progress Dashboard Stuck Together) ── */
  .sticky-header-wrapper {
    position: sticky;
    top: 0;
    z-index: 60;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .topbar {
    position: relative;
    width: 100%;
    background: rgba(10, 14, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  :root[data-theme="light"] .topbar, html[data-theme="light"] .topbar {
    background: rgba(255, 255, 255, 0.92);
    border-bottom-color: rgba(0, 0, 0, 0.08);
  }

  .brand {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .brand-icon {
    font-size: 19px;
    display: inline-block;
    animation: shield-pulse 2.5s infinite ease-in-out;
  }
  .brand-text {
    background: linear-gradient(90deg, var(--accent), var(--safe));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .brand-text code {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 1em;
    box-shadow: none;
  }
  .brand:hover .brand-text {
    filter: drop-shadow(0 0 10px rgba(255, 200, 87, 0.5));
  }
  @keyframes shield-pulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px var(--safe)); }
    50% { transform: scale(1.15); filter: drop-shadow(0 0 10px var(--safe)); }
  }

  .controls-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-family: var(--sans);
    font-size: 12px;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .lang-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .lang-active { color: var(--accent); text-shadow: 0 0 8px var(--accent-bg); }
  .lang-inactive { color: var(--text-muted); }
  .switch { position: relative; display: inline-block; width: 32px; height: 18px; margin: 0 4px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border); transition: .4s; border-radius: 20px;
  }
  .slider:before {
    position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
    background-color: var(--text); transition: .4s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(14px); background-color: #fff; }

  /* ── Layout Wrap ── */
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px 0;
    position: relative;
    z-index: 1;
  }

  /* ── Hero Section ── */
  .hero {
    padding: 34px 0 16px;
  }
  .eyebrow-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .hero .eyebrow, .field-checklist-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    height: 32px;
    box-sizing: border-box;
    white-space: nowrap;
    text-decoration: none;
  }
  .hero .eyebrow {
    font-family: var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    background: var(--accent-bg);
    border: 1px solid rgba(255, 200, 87, 0.35);
  }
  .hero .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--safe);
    box-shadow: 0 0 8px var(--safe);
    flex-shrink: 0;
  }
  .field-checklist-btn {
    font-family: var(--sans);
    color: #F1F2F6;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(168, 85, 247, 0.22));
    border: 1px solid rgba(168, 85, 247, 0.45);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.15);
  }
  .field-checklist-btn:hover {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.38), rgba(168, 85, 247, 0.38));
    border-color: rgba(168, 85, 247, 0.85);
    color: #FFFFFF;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
  }
  .field-checklist-btn .f-icon {
    font-size: 13px;
    line-height: 1;
  }
  .field-checklist-btn .f-arrow {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    transition: transform 0.2s ease;
    line-height: 1;
  }
  .field-checklist-btn:hover .f-arrow {
    transform: translateX(3px);
  }
  html[data-theme="light"] .field-checklist-btn {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.12));
    border-color: rgba(99, 102, 241, 0.35);
    color: #1E1B4B;
  }
  .hero h1 {
    font-size: clamp(26px, 4.2vw, 36px);
    line-height: 1.25;
    margin: 12px 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .hero h1 .phase-tag {
    font-family: var(--mono);
    font-size: 0.48em;
    vertical-align: middle;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid rgba(255, 200, 87, 0.4);
    padding: 4px 10px;
    border-radius: 8px;
    margin-right: 12px;
    display: inline-block;
    letter-spacing: 0.05em;
  }
  .hero p#heroDesc {
    color: var(--text-muted);
    max-width: 72ch;
    margin: 0;
    font-size: 15px;
    line-height: 1.65;
  }

  /* ── Systematic Phase Navigator & Structured Grid ── */
  .phase-navigator {
    margin: 24px 0 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }
  .phase-nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .phase-nav-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .matrix-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .phase-nav-steppers {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .phase-nav-step-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .phase-nav-step-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-bg);
    transform: translateY(-1px);
  }
  .phase-nav-step-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .phase-nav-current-pill {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
  }

  /* ── 13-Phase Systematic Grid: 3 in first 3 rows, 4 in last row ── */
  .phase-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .phase-card-btn {
    grid-column: span 4;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .phase-card-btn:nth-child(n+10) {
    grid-column: span 3;
  }
  .phase-card-btn:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .phase-card-btn.active {
    background: var(--panel);
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(255, 200, 87, 0.22);
  }
  .phase-card-btn.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3.5px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .phase-card-btn.is-complete {
    border-color: rgba(62, 207, 142, 0.35);
  }
  .phase-card-btn.is-complete:hover {
    border-color: var(--safe);
  }
  .phase-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .phase-card-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(255, 200, 87, 0.12);
    border: 1px solid rgba(255, 200, 87, 0.3);
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .phase-card-btn.active .phase-card-num {
    background: var(--accent);
    color: #050810;
    border-color: var(--accent);
  }
  .phase-card-status {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .phase-card-status.is-complete {
    color: var(--safe);
    font-weight: 700;
  }
  .phase-card-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .phase-card-bar {
    height: 3px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 2px;
  }
  html[data-theme="light"] .phase-card-bar {
    background: rgba(0, 0, 0, 0.06);
  }
  .phase-card-bar-fill {
    height: 100%;
    background: var(--safe);
    width: 0%;
    transition: width 0.3s ease;
  }
  .phase-card-btn.active .phase-card-bar-fill {
    background: linear-gradient(90deg, var(--accent), var(--safe));
  }

  /* ── Testing Progress Dashboard: Ultra-Slim Full-Width Strip Stuck to Topbar ── */
  .topbar-progress-panel {
    width: 100%;
    background: rgba(13, 19, 36, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 4px 20px 6px;
    transition: padding 0.25s ease, background 0.25s ease;
  }
  html[data-theme="light"] .topbar-progress-panel {
    background: rgba(244, 247, 251, 0.96);
    border-bottom-color: rgba(0, 0, 0, 0.1);
  }
  .topbar-progress-inner {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .progress-panel-top-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    line-height: 1;
    max-height: 20px;
    opacity: 1;
    overflow: hidden;
    transition: max-height 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.2s ease,
                margin 0.25s ease;
    margin-bottom: 2px;
  }
  .topbar-progress-panel.is-scrolled .progress-panel-top-row {
    max-height: 0;
    opacity: 0;
    margin-bottom: 0;
    pointer-events: none;
  }
  .topbar-progress-panel.is-scrolled {
    padding-top: 3px;
    padding-bottom: 5px;
  }
  .progress-title-badge {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-main-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .pulse-indicator {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--safe);
    box-shadow: 0 0 8px var(--safe);
    animation: pulseGlow 2s infinite ease-in-out;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* Dual Progress Grid with Reset in the Middle */
  .progress-panel-bars {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  .progress-middle-reset {
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
  }
  .btn-middle-reset {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 91, 0.45);
    padding: 3px 11px;
    border-radius: 14px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
    height: 22px;
    box-sizing: border-box;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 1px 6px rgba(255, 107, 91, 0.18);
  }
  .btn-middle-reset:hover {
    background: var(--danger);
    color: #ffffff;
    border-color: var(--danger);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(255, 107, 91, 0.4);
  }
  .btn-middle-reset .reset-icon { font-size: 10.5px; transition: transform 0.35s ease; }
  .btn-middle-reset:hover .reset-icon { transform: rotate(-180deg); }
  .progress-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .progress-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    line-height: 1;
  }
  .progress-row-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-badge {
    font-size: 8.5px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    font-family: var(--mono);
    flex-shrink: 0;
  }
  .phase-badge {
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid rgba(255, 200, 87, 0.35);
  }
  .overall-badge {
    background: rgba(87, 199, 212, 0.15);
    color: var(--accent-2);
    border: 1px solid rgba(87, 199, 212, 0.35);
  }
  .progress-count-pill {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .progress-count-pill.overall-pill {
    color: var(--accent-2);
    border-color: rgba(87, 199, 212, 0.3);
  }
  .progress-track {
    height: 5px;
    border-radius: 999px;
    background: var(--panel-2);
    overflow: hidden;
    border: 1px solid var(--border-light);
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--safe));
    width: 0%;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 8px rgba(62, 207, 142, 0.5);
  }
  .progress-fill.overall-fill {
    background: linear-gradient(90deg, #3B82F6, var(--accent-2), var(--safe));
    box-shadow: 0 0 8px rgba(87, 199, 212, 0.5);
  }

  @media (max-width: 820px) {
    .progress-panel-bars {
      grid-template-columns: 1fr;
      gap: 5px;
    }
    .progress-middle-reset {
      padding-top: 0;
      order: 2;
    }
    .progress-col:first-child { order: 1; }
    .progress-col.overall-col { order: 3; }
  }

  /* ── Phase Actions Row (Collapse All Button below WAPT Methodology Phases) ── */
  .phase-actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin: 14px 0 0;
  }
  .btn-phase-expand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-phase-expand:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(255, 200, 87, 0.1);
    transform: translateY(-1px);
  }
  .btn-phase-reset {
    color: var(--danger);
    border-color: rgba(255, 107, 107, 0.35);
  }
  .btn-phase-reset:hover {
    color: #fff;
    border-color: var(--danger);
    background: var(--danger-bg);
    transform: translateY(-1px);
  }

  /* ── Step Cards List ── */
  section.steps {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step-card {
    scroll-margin-top: 96px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
    box-shadow: var(--shadow-sm);
  }
  .step-card:hover {
    border-color: rgba(255, 200, 87, 0.4);
    box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  }
  .step-card.is-checked {
    border-color: rgba(62, 207, 142, 0.45);
    background: linear-gradient(180deg, rgba(62, 207, 142, 0.04) 0%, var(--panel) 100%);
  }
  .step-card.is-expanded {
    border-color: rgba(87, 199, 212, 0.45);
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .step-header:hover {
    background: rgba(255, 255, 255, 0.02);
  }

  .step-checkbox {
    position: relative;
    display: flex;
    align-items: center;
    flex: none;
  }
  .step-checkbox input {
    position: absolute;
    opacity: 0;
    width: 22px;
    height: 22px;
    margin: 0;
    cursor: pointer;
  }
  .checkmark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.8px solid var(--border);
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    transition: all 0.2s ease;
  }
  .step-checkbox input:checked + .checkmark {
    background: var(--safe);
    border-color: var(--safe);
    box-shadow: 0 0 10px rgba(62, 207, 142, 0.4);
  }
  .checkmark::after {
    content: "";
    width: 5px;
    height: 10px;
    border: solid #050810;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  html[data-theme="light"] .checkmark::after {
    border-color: #ffffff;
  }
  .step-checkbox input:checked + .checkmark::after {
    opacity: 1;
  }

  .step-num {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 6px;
    flex: none;
  }
  .step-emoji {
    font-size: 20px;
    flex: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
  }
  .step-title {
    font-weight: 600;
    font-size: 15.5px;
    flex: 1;
    min-width: 0;
    color: var(--text);
    transition: color 0.2s ease;
  }
  .step-card.is-checked .step-title {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
  }
  .step-chevron {
    flex: none;
    font-size: 20px;
    font-weight: bold;
    color: var(--text-muted);
    transition: transform 0.22s ease, color 0.22s ease;
  }
  .step-card.is-expanded .step-chevron {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .step-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    border-top: 1px solid transparent;
  }
  .step-card.is-expanded .step-body {
    max-height: 2800px;
    border-top-color: var(--border);
  }
  .step-body-inner {
    padding: 16px 20px 24px 54px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: rgba(0, 0, 0, 0.12);
  }
  html[data-theme="light"] .step-body-inner {
    background: rgba(0, 0, 0, 0.02);
  }

  .detail-label {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
  }
  .detail-text {
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.6;
  }
  .expected-text {
    background: var(--safe-bg);
    border-left: 3px solid var(--safe);
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
    color: var(--text);
  }
  .procedure-list {
    margin: 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .procedure-list li {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .step-body :not(pre) > code, .step-body p > code, .step-body li > code {
    font-family: var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.88em;
    color: var(--accent);
  }
  .step-body strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ── Realistic & Colourful Terminal Window ── */
  .terminal {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #080C14;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }
  html[data-theme="light"] .terminal {
    background: #0D1321;
    border-color: #263049;
  }
  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    background: #0e1424;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .terminal-bar .tdot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .tdot.red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
  .tdot.yellow { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.4); }
  .tdot.green { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }
  .terminal-lang {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .terminal-body {
    margin: 0;
    padding: 14px 16px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    color: #E2E8F0;
    white-space: pre;
    background: transparent !important;
  }
  .terminal-body code {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    font-size: 13px !important;
    color: inherit !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    font-family: inherit !important;
  }

  /* Real & Colorful Terminal Syntax Colors */
  .syn-cmd { color: #38BDF8; font-weight: 600; }
  .syn-flag { color: #FBBF24; }
  .syn-url { color: #A78BFA; }
  .syn-str { color: #34D399; }
  .syn-comment { color: #64748B; font-style: italic; }
  .syn-param { color: #FB7185; font-weight: 600; }
  .syn-method { color: #60A5FA; font-weight: 700; }
  .syn-hdr { color: #F59E0B; font-weight: 600; }
  .syn-key { color: #C084FC; }
  .syn-num { color: #F97316; }
  .syn-proto { color: #34D399; }
  .syn-op { color: #F43F5E; }
  .copy-row {
    display: flex;
    justify-content: flex-end;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.04);
  }
  .copy-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(255, 200, 87, 0.1);
  }
  .no-payload {
    font-size: 13px;
    color: var(--text-faint);
    font-style: italic;
    background: var(--panel-2);
    border: 1px dashed var(--border);
    padding: 10px 14px;
    border-radius: 8px;
  }

  /* ── Glossary Section ── */
  section.glossary {
    margin-top: 48px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .glossary-head {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  .glossary-head h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .glossary-head .glossary-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .glossary-chevron {
    margin-left: auto;
    font-size: 20px;
    font-weight: bold;
    color: var(--text-muted);
    transition: transform 0.22s ease, color 0.22s ease;
  }
  section.glossary.is-open .glossary-chevron {
    transform: rotate(90deg);
    color: var(--accent);
  }
  .glossary-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  section.glossary.is-open .glossary-body {
    max-height: 8000px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .glossary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .g-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: all 0.2s ease;
  }
  .g-item:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .g-term {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .g-def {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.55;
  }

  /* ── Designed and Developed by Footer (Exact formatting from idor.html) ── */
  .modern-footer { padding: 32px 18px 20px; text-align: center; position: relative; z-index: 1; }
  .footer-badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(145deg, var(--panel-2), var(--panel));
    padding: 12px 28px; border-radius: 30px; font-family: var(--mono); font-size: 13.5px;
    color: var(--text-muted); border: 1px solid var(--border);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25); cursor: default;
  }
  .footer-badge:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(239, 68, 68, 0.25);
    border-color: var(--danger);
    color: var(--text);
  }
  .dev-name {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    background: linear-gradient(90deg, #3B82F6, #A855F7, #F43F5E, #F59E0B, #3B82F6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 200% auto;
    animation: gradient-flow 4s linear infinite;
  }
  @keyframes gradient-flow {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* ── Responsive Mobile & Tablet Styles ── */
  @media (max-width: 960px) and (min-width: 641px) {
    .phase-grid { grid-template-columns: repeat(6, 1fr); }
    .phase-card-btn, .phase-card-btn { grid-column: span 3; }
  .phase-card-btn:nth-child(n+10) { grid-column: span 3; }
    .phase-card-btn:last-child { grid-column: span 6; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 14px 0; }
    .topbar { padding: 10px 14px; }
    .brand-text { font-size: 13.5px; }
    .theme-toggle { padding: 5px 10px; font-size: 11px; }
    .lang-switch-wrapper { padding: 5px 8px; font-size: 11px; }
    .hero { padding: 22px 0 12px; }
    .topbar-progress-panel { padding: 8px 12px 10px; }
    .progress-panel-top-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    .progress-actions { width: 100%; justify-content: space-between; margin-left: 0; }
    .phase-nav-header { flex-direction: column; align-items: flex-start; }
    .phase-nav-steppers { width: 100%; justify-content: space-between; margin-left: 0; }
    .phase-grid { grid-template-columns: 1fr; }
    .phase-card-btn, .phase-card-btn:nth-child(n+10) { grid-column: span 1; }
    .step-body-inner { padding: 12px 14px 18px 16px; }
    .glossary-grid { grid-template-columns: 1fr; }
  }


  /* ── Dedicated Target Fields Selector & Field Buttons ── */
  .fields-navigator {
    margin: 20px 0 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }
  .fields-nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .fields-nav-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .fields-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--safe);
    box-shadow: 0 0 8px var(--safe);
  }
  .fields-count-badge {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .fields-scope-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px;
    border-radius: 8px;
    margin-left: auto;
  }
  .scope-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .scope-btn:hover {
    color: var(--text);
  }
  .scope-btn.active {

const STORAGE_KEY = "webappsec_field_checklist_progress_v1";
const ACTIVE_PHASE_KEY = "webappsec_field_checklist_active_v1";
const PREFS_KEY = "webappsec_field_checklist_prefs_v1";
const LAST_OPENED_STEP_KEY = "webappsec_field_last_opened_step_v1";

function getSavedLastOpenedStep() {
  try {
    const raw = localStorage.getItem(LAST_OPENED_STEP_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed.catId === "number" && typeof parsed.stepId === "number") {
      return parsed;
    }
  } catch(e) {}
  return null;
}

function saveLastOpenedStep(catId, stepId) {
  try {
    if (catId && stepId) {
      localStorage.setItem(LAST_OPENED_STEP_KEY, JSON.stringify({ catId, stepId }));
    } else {
      localStorage.removeItem(LAST_OPENED_STEP_KEY);
    }
  } catch(e) {}
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    const result = {};
    Object.keys(parsed).forEach(k => {
      result[k] = new Set(parsed[k]);
    });
    return result;
  }catch(e){ return {}; }
}

function getSavedActivePhase(savedProgress){
  try {
    const saved = localStorage.getItem(ACTIVE_PHASE_KEY);
    if (saved) {
      const num = parseInt(saved, 10);
      if (!isNaN(num) && num >= 1 && num <= phasesData.length) {
        return num;
      }
    }
  } catch(e) {}
  return 1;
}

  const prefs = { lang: "hi", theme: "dark" };
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.lang === "en" || parsed.lang === "hi") prefs.lang = parsed.lang;
      if (parsed.theme === "dark" || parsed.theme === "light") prefs.theme = parsed.theme;
    }
  } catch(e) {}
  return prefs;
}

function saveProgress(){
  try{
    const toSave = {};
    Object.keys(state.checked).forEach(k => {
      toSave[k] = Array.from(state.checked[k]);
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e){}
}

const savedProgress = loadProgress();
const savedPrefs = loadSavedPrefs();
const initialActivePhase = getSavedActivePhase(savedProgress);

const state = {
  lang: savedPrefs.lang,
  theme: savedPrefs.theme,
  activePhase: initialActivePhase,
  checked: {},
  expanded: {},
  glossaryOpen: false,
  fieldScope: "category", // "category" or "all"
  fieldSearchQuery: ""
};

const savedLastOpened = getSavedLastOpenedStep();

phasesData.forEach(p => {
  state.checked[p.id] = savedProgress[p.id] || new Set();
  // ALL CHECKLIST ITEMS COLLAPSED ON PAGE LOAD:
  state.expanded[p.id] = new Set();
});

// If local data has a last opened step, expand ONLY that step:
if (savedLastOpened && state.expanded[savedLastOpened.catId]) {
  state.expanded[savedLastOpened.catId].add(savedLastOpened.stepId);
}

function getPhase(){ return phasesData.find(p=>p.id===state.activePhase); }
function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(str){
  let out = escapeHtml(str);
  out = out.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  out = out.replace(/`(.+?)`/g,"<code>$1</code>");
  return out;
}

function colorizeLine(line, lang) {
  const trimmed = line.trim();
  if (!trimmed) return "";
  if (trimmed.startsWith("#") || trimmed.startsWith("//")) {
    return '<span class="syn-comment">' + escapeHtml(line) + '</span>';
  }

  if (lang === "http") {
    const mReq = line.match(/^([A-Z]{3,7})\s+(\S+)\s+(HTTP\/[0-9.]+)/);
    if (mReq) {
      return '<span class="syn-method">' + mReq[1] + '</span> ' +
             '<span class="syn-url">' + escapeHtml(mReq[2]) + '</span> ' +
             '<span class="syn-proto">' + mReq[3] + '</span>';
    }
    const mRes = line.match(/^(HTTP\/[0-9.]+)\s+(\d{3})\s*(.*)/);
    if (mRes) {
      return '<span class="syn-proto">' + mRes[1] + '</span> ' +
             '<span class="syn-num">' + mRes[2] + '</span> ' +
             '<span class="syn-str">' + escapeHtml(mRes[3]) + '</span>';
    }
    const mHdr = line.match(/^([A-Za-z0-9_-]+:)\s*(.*)/);
    if (mHdr) {
      let val = escapeHtml(mHdr[2]);
      val = val.replace(/(&lt;[^&]*&gt;|§[^§]*§)/g, (m) => '<span class="syn-param">' + m + '</span>');
      return '<span class="syn-hdr">' + mHdr[1] + '</span> ' + val;
    }
  }

  if (lang === "json") {
    let esc = escapeHtml(line);
    esc = esc.replace(/(&quot;[a-zA-Z0-9_ -]+&quot;|"[a-zA-Z0-9_ -]+")\s*:/g, (m) => '<span class="syn-key">' + m.slice(0, -1) + '</span>:');
    esc = esc.replace(/:\s*(&quot;[^&]*&quot;|"[^"]*")/g, (m, g1) => ': <span class="syn-str">' + g1 + '</span>');
    esc = esc.replace(/:\s*(true|false|null|\d+)/g, (m, g1) => ': <span class="syn-num">' + g1 + '</span>');
    return esc;
  }

  const tokens = line.match(/(\"[^\"]*\"|'[^']*'|https?:\/\/[^\s\"\'\`]+|--?[a-zA-Z0-9_-]+|=|&amp;&amp;|\||;|\s+|[^\s\"\'\`]+)/g) || [line];
  let isFirstWord = true;

  const result = tokens.map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    
    if (isFirstWord && /^[a-zA-Z0-9_.:-]+$/.test(tok)) {
      isFirstWord = false;
      return '<span class="syn-cmd">' + escapeHtml(tok) + '</span>';
    }
    if (tok === "|" || tok === "&&" || tok === ";") {
      isFirstWord = true;
      return '<span class="syn-op">' + escapeHtml(tok) + '</span>';
    }
    isFirstWord = false;

    if (/^https?:\/\//.test(tok)) {
      return '<span class="syn-url">' + escapeHtml(tok) + '</span>';
    }
    if ((tok.startsWith('\"') && tok.endsWith('\"')) || (tok.startsWith("'") && tok.endsWith("'"))) {
      return '<span class="syn-str">' + escapeHtml(tok) + '</span>';
    }
    if (/^--?[a-zA-Z0-9_-]+/.test(tok)) {
      return '<span class="syn-flag">' + escapeHtml(tok) + '</span>';
    }
    if (/^<.*>$/.test(tok) || /^§.*§$/.test(tok)) {
      return '<span class="syn-param">' + escapeHtml(tok) + '</span>';
    }
    return escapeHtml(tok);
  });

  return result.join("");
}

function colorizePayload(code, lang) {
  if (!code) return "";
  const lines = code.split("\n");
  return lines.map(l => colorizeLine(l, lang)).join("\n");
}

function switchPhase(phaseId) {
  const num = Number(phaseId);
  if (isNaN(num) || num < 1 || num > phasesData.length) return;
  state.activePhase = num;
  try {
    localStorage.setItem(ACTIVE_PHASE_KEY, String(num));
  } catch(e) {}
  // When switching category, checklist is automatically collapsed until user expands
  if (state.expanded[num]) {
    state.expanded[num].clear();
  }
  renderAll();
}

function prevPhase() {
  if (state.activePhase > 1) {
    switchPhase(state.activePhase - 1);
  }
}

function nextPhase() {
  if (state.activePhase < phasesData.length) {
    switchPhase(state.activePhase + 1);
  }
}

function toggleLanguage() {
  const cb = document.getElementById("langToggle");
  if (cb) state.lang = cb.checked ? "en" : "hi";
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({ lang: state.lang, theme: state.theme }));
  } catch(e) {}
  updateLangUI();
  renderAll();
}

function updateLangUI() {
  const isEn = state.lang === "en";
  const cb = document.getElementById("langToggle");
  if (cb) cb.checked = isEn;
  const lblHi = document.getElementById("lbl-hi");
  const lblEn = document.getElementById("lbl-en");
  if (lblHi && lblEn) {
    if (isEn) {
      lblHi.className = "lang-inactive";
      lblEn.className = "lang-active";
    } else {
      lblHi.className = "lang-active";
      lblEn.className = "lang-inactive";
    }
  }
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({ lang: state.lang, theme: state.theme }));
  } catch(e) {}
  document.documentElement.setAttribute("data-theme", state.theme);
  const themeBtn = document.getElementById("themeBtn");
  if (themeBtn) {
    themeBtn.textContent = state.theme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
  }
}

function renderChrome(){
  const L = labels[state.lang];
  const phase = getPhase();
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(L[key]!==undefined) el.textContent = L[key];
  });

  updateLangUI();
  const themeBtn = document.getElementById("themeBtn");
  if (themeBtn) {
    themeBtn.textContent = state.theme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
  }

  const title = state.lang==="hi" ? phase.title_hi : phase.title_en;
  const phaseTagEl = document.getElementById("phaseTag");
  if (phaseTagEl) phaseTagEl.textContent = "FIELD " + String(phase.id).padStart(2,"0");
  const heroTitleEl = document.getElementById("heroTitle");
  if (heroTitleEl) heroTitleEl.textContent = title;
  const heroDescEl = document.getElementById("heroDesc");
  if (heroDescEl) heroDescEl.textContent = state.lang==="hi" ? phase.desc_hi : phase.desc_en;

  const expandBtn = document.getElementById("expandToggle");
  const allExpanded = state.expanded[phase.id].size === phase.steps.length;
  if (expandBtn) {
    expandBtn.innerHTML = '<span class="expand-icon">⤢</span> <span class="expand-text">' + (allExpanded ? L.collapseAll : L.expandAll) + '</span>';
  }
  const resetBtn = document.getElementById("resetProgress");
  if (resetBtn) {
    resetBtn.innerHTML = '<span class="reset-icon">↺</span> <span class="reset-text">' + L.resetBtn + '</span>';
  }
}

function renderPhaseSwitcher(){
  const el = document.getElementById("phaseSwitcher");
  if (!el) return;

  const currentPill = document.getElementById("phaseNavCurrent");
  if (currentPill) {
    currentPill.textContent = "Field " + String(state.activePhase).padStart(2, "0") + " / " + phasesData.length;
  }

  let html = phasesData.map(p => {
    const t = state.lang === "hi" ? p.title_hi : p.title_en;
    const checkedSet = state.checked[p.id] || new Set();
    const checkedCount = checkedSet.size;
    const totalCount = p.steps.length;
    const pct = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;
    const isComplete = totalCount > 0 && checkedCount === totalCount;
    const isActive = p.id === state.activePhase;

    return '<button class="phase-card-btn ' + (isActive ? 'active' : '') + ' ' + (isComplete ? 'is-complete' : '') + '" data-phase="' + p.id + '" type="button">' +
      '<div class="phase-card-top">' +
        '<span class="phase-card-num">F' + String(p.id).padStart(2, "0") + '</span>' +
        '<span class="phase-card-status ' + (isComplete ? 'is-complete' : '') + '">' + (isComplete ? '✓ Done' : (checkedCount + '/' + totalCount)) + '</span>' +
      '</div>' +
      '<div class="phase-card-title" title="' + escapeHtml(t) + '">' + escapeHtml(t) + '</div>' +
      '<div class="phase-card-bar">' +
        '<div class="phase-card-bar-fill" style="width: ' + pct + '%"></div>' +
      '</div>' +
    '</button>';
  }).join("");

  el.innerHTML = html;

  el.querySelectorAll(".phase-card-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      switchPhase(Number(btn.dataset.phase));
    });
  });
}

/* ── Targeted Field Buttons & Field Search Implementation ── */
function renderCategoryPills() {
  const bar = document.getElementById("categoryPillsBar");
  if (!bar) return;

  let html = phasesData.map(p => {
    const isActive = state.fieldScope === 'category' && state.activePhase === p.id && !state.fieldSearchQuery;
    const checkedSet = state.checked[p.id] || new Set();
    const isComplete = p.steps.length > 0 && checkedSet.size === p.steps.length;
    const num = String(p.id).padStart(2, "0");
    const countText = isComplete ? "✓" : checkedSet.size + "/" + p.steps.length;

    return '<button class="cat-pill-btn ' + (isActive ? 'active' : '') + ' ' + (isComplete ? 'is-complete' : '') + '" type="button" onclick="selectCategoryPill(' + p.id + ')">' +
      '<span class="c-num">F' + num + '</span>' +
      '<span class="c-title">' + escapeHtml(p.tag) + '</span>' +
      '<span class="c-count">' + countText + '</span>' +
    '</button>';
  }).join("");

  bar.innerHTML = html;
}

function selectCategoryPill(catId) {
  state.fieldScope = "category";
  const scopeCatBtn = document.getElementById("scopeCategoryBtn");
  const scopeAllBtn = document.getElementById("scopeAllBtn");
  if (scopeCatBtn && scopeAllBtn) {
    scopeCatBtn.classList.add("active");
    scopeAllBtn.classList.remove("active");
  }
  clearFieldSearch();
  switchPhase(catId);
  renderCategoryPills();
  renderFieldButtons();
}

function setFieldScope(scope) {
  state.fieldScope = scope;
  const scopeCatBtn = document.getElementById("scopeCategoryBtn");
  const scopeAllBtn = document.getElementById("scopeAllBtn");
  if (scopeCatBtn && scopeAllBtn) {
    scopeCatBtn.classList.toggle("active", scope === "category");
    scopeAllBtn.classList.toggle("active", scope === "all");
  }
  renderCategoryPills();
  renderFieldButtons();
}

function handleFieldSearch(query) {
  state.fieldSearchQuery = (query || "").trim().toLowerCase();
  const clearBtn = document.getElementById("fieldSearchClear");
  if (clearBtn) {
    clearBtn.style.display = state.fieldSearchQuery ? "flex" : "none";
  }
  renderFieldButtons();
}

function clearFieldSearch() {
  const input = document.getElementById("fieldSearchInput");
  if (input) input.value = "";
  state.fieldSearchQuery = "";
  const clearBtn = document.getElementById("fieldSearchClear");
  if (clearBtn) clearBtn.style.display = "none";
  renderFieldButtons();
}

function renderFieldButtons() {
  const grid = document.getElementById("fieldButtonsGrid");
  const countBadge = document.getElementById("fieldsCountBadge");
  if (!grid) return;

  const q = state.fieldSearchQuery;
  const isAll = state.fieldScope === "all" || q.length > 0; // if user searches, search all fields

  // Gather field items
  let items = [];
  if (isAll) {
    phasesData.forEach(cat => {
      cat.steps.forEach(st => {
        items.push({ category: cat, step: st });
      });
    });
  } else {
    const currentCat = getPhase();
    currentCat.steps.forEach(st => {
      items.push({ category: currentCat, step: st });
    });
  }

  // Deep Search: Field name, title, objective, category, payload code & keywords
  if (q) {
    items = items.filter(({ category, step }) => {
      const fEn = (step.field_en || "").toLowerCase();
      const fHi = (step.field_hi || "").toLowerCase();
      const tEn = (step.en.title || "").toLowerCase();
      const tHi = (step.hi.title || "").toLowerCase();
      const objEn = (step.en.objective || "").toLowerCase();
      const objHi = (step.hi.objective || "").toLowerCase();
      const cTag = (category.tag || "").toLowerCase();
      const cTitle = (category.title_en || "").toLowerCase();
      const payloadCode = step.payload ? (step.payload.code || "").toLowerCase() : "";
      const kw = (step.keywords || []).map(k => k.toLowerCase()).join(" ");

      return fEn.includes(q) || fHi.includes(q) ||
             tEn.includes(q) || tHi.includes(q) ||
             objEn.includes(q) || objHi.includes(q) ||
             cTag.includes(q) || cTitle.includes(q) ||
             payloadCode.includes(q) || kw.includes(q);
    });
  }

  if (countBadge) {
    if (q) {
      countBadge.textContent = `${items.length} Matching Fields`;
    } else if (isAll) {
      countBadge.textContent = `All ${items.length} Fields`;
    } else {
      countBadge.textContent = `${items.length} Fields in Category`;
    }
  }

  if (items.length === 0) {
    grid.innerHTML = '<div class="field-btn-empty">No fields matching "<strong>' + escapeHtml(q) + '</strong>". <button onclick="clearFieldSearch()" style="background:transparent; border:none; color:var(--accent); text-decoration:underline; cursor:pointer;">Clear search</button></div>';
    return;
  }

  grid.innerHTML = items.map(({ category, step }) => {
    const checkedSet = state.checked[category.id] || new Set();
    const isChecked = checkedSet.has(step.id);
    const label = state.lang === "hi" ? (step.field_hi || step.hi.title) : (step.field_en || step.en.title);
    const showCatBadge = isAll;

    return '<button class="field-btn ' + (isChecked ? 'is-checked' : '') + '" type="button" onclick="jumpToField(' + category.id + ', ' + step.id + ')" title="' + escapeHtml(label) + '">' +
      (showCatBadge ? '<span class="f-cat-badge">' + category.tag + '</span>' : '<span class="f-num">#' + String(step.id).padStart(2, "0") + '</span>') +
      '<span class="f-emoji">' + step.emoji + '</span>' +
      '<span class="f-label">' + escapeHtml(label) + '</span>' +
      '<span class="f-check">✓</span>' +
    '</button>';
  }).join("");
}

function scrollToStepCard(stepId, addPulse = false) {
  setTimeout(() => {
    const el = document.querySelector(`.step-header input[data-id="${stepId}"]`);
    if (el) {
      const card = el.closest(".step-card");
      if (card) {
        const topbar = document.querySelector(".sticky-header-wrapper");
        const topbarH = topbar ? topbar.getBoundingClientRect().height : 56;
        const breathingRoom = 26; // generous space slightly above the card
        const cardTopY = card.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo({
          top: Math.max(0, cardTopY - topbarH - breathingRoom),
          behavior: "smooth"
        });
        if (addPulse) {
          card.classList.add("search-target-pulse");
          setTimeout(() => card.classList.remove("search-target-pulse"), 2200);
        }
      }
    }
  }, 90);
}

function jumpToField(catId, stepId) {
  if (catId !== state.activePhase) {
    state.activePhase = catId;
    try {
      localStorage.setItem(ACTIVE_PHASE_KEY, String(catId));
    } catch(e) {}
  }
  // Expand ONLY that clicked checklist step
  if (state.expanded[catId]) {
    state.expanded[catId].clear();
    state.expanded[catId].add(stepId);
  }
  saveLastOpenedStep(catId, stepId);

  renderSteps();
  renderChrome();
  renderCategoryPills();
  renderFieldButtons();

  scrollToStepCard(stepId, true);
}

function updateProgress(){
  // Kept for backward compatibility
}

function renderSteps(){
  const L = labels[state.lang];
  const phase = getPhase();
  const checkedSet = state.checked[phase.id];
  const expandedSet = state.expanded[phase.id];
  const container = document.getElementById("stepsContainer");
  container.innerHTML = "";

  phase.steps.forEach(step=>{
    const t = step[state.lang];
    const isChecked = checkedSet.has(step.id);
    const isExpanded = expandedSet.has(step.id);

    const card = document.createElement("div");
    card.className = "step-card" + (isChecked?" is-checked":"") + (isExpanded?" is-expanded":"");
    card.id = `step_${phase.id}_${step.id}`;

    const header = document.createElement("div");
    header.className = "step-header";
    header.tabIndex = 0;
    header.innerHTML =
      '<label class="step-checkbox"><input type="checkbox" '+(isChecked?"checked":"")+' data-id="'+step.id+'"><span class="checkmark"></span></label>'+
      '<span class="step-num">'+String(step.id).padStart(2,"0")+'</span>'+
      '<span class="step-emoji">'+step.emoji+'</span>'+
      '<span class="step-title">'+fmt(t.title)+'</span>'+
      '<span class="step-chevron">›</span>';
    header.addEventListener("click",(e)=>{ if(e.target.closest(".step-checkbox")) return; toggleExpand(step.id); });
    header.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleExpand(step.id); } });

    const body = document.createElement("div");
    body.className = "step-body";
    let bodyHtml = '<div class="step-body-inner">';
    bodyHtml += '<div class="detail-block"><div class="detail-label">'+L.objective+'</div><div class="detail-text">'+fmt(t.objective)+'</div></div>';
    bodyHtml += '<div class="detail-block"><div class="detail-label">🔍 '+L.procedure+'</div><ol class="procedure-list">'+t.procedure.map(p=>"<li>"+fmt(p)+"</li>").join("")+'</ol></div>';
    bodyHtml += '<div class="detail-block"><div class="detail-label">🎯 '+L.expected+'</div><div class="detail-text expected-text">'+fmt(t.expected)+'</div></div>';
    bodyHtml += '<div class="detail-block"><div class="detail-label">💻 '+L.payload+'</div>';
    if(step.payload){
      bodyHtml += '<div class="terminal"><div class="terminal-bar"><span class="tdot red"></span><span class="tdot yellow"></span><span class="tdot green"></span><span class="terminal-lang">'+step.payload.lang+'</span></div>'+
        '<pre class="terminal-body"><code>'+colorizePayload(step.payload.code, step.payload.lang)+'</code></pre>'+
        '<div class="copy-row"><button class="copy-btn" data-step-id="'+step.id+'">'+L.copy+'</button></div></div>';
    } else {
      bodyHtml += '<div class="no-payload">'+L.noPayload+'</div>';
    }
    bodyHtml += '</div></div>';
    body.innerHTML = bodyHtml;

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });

  container.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener("change",(e)=>toggleCheck(Number(e.target.dataset.id)));
  });
  container.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id = Number(btn.dataset.stepId);
      const st = getPhase().steps.find(s=>s.id===id);
      const Lc = labels[state.lang];
      const finish = ()=>{ btn.textContent = Lc.copied; setTimeout(()=>{ btn.textContent = Lc.copy; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(st.payload.code).then(finish).catch(finish);
      } else { finish(); }
    });
  });
}

function toggleExpand(id){
  const set = state.expanded[state.activePhase];
  const isExpanding = !set.has(id);
  if(set.has(id)) {
    set.delete(id);
    const last = getSavedLastOpenedStep();
    if (last && last.catId === state.activePhase && last.stepId === id) {
      saveLastOpenedStep(null, null);
    }
  } else {
    // Accordion: auto-collapse all other expanded cards in this category
    set.clear();
    set.add(id);
    saveLastOpenedStep(state.activePhase, id);
  }
  renderSteps();
  renderChrome();

  // If user expands any checklist, smoothly scroll to that section for clear visibility
  if (isExpanding) {
    scrollToStepCard(id, false);
  }
}

function toggleCheck(id){
  const set = state.checked[state.activePhase];
  const isNowChecked = !set.has(id);
  if(set.has(id)) set.delete(id); else set.add(id);

  // When user ticks the checklist, it automatically collapses:
  if (isNowChecked) {
    state.expanded[state.activePhase].delete(id);
    const last = getSavedLastOpenedStep();
    if (last && last.catId === state.activePhase && last.stepId === id) {
      saveLastOpenedStep(null, null);
    }
  }

  saveProgress();
  try {
    localStorage.setItem(ACTIVE_PHASE_KEY, String(state.activePhase));
  } catch(e) {}
  renderSteps(); 
  updateProgress();
  renderCategoryPills();
  renderFieldButtons();
}

function resetAllProgress(){
  const msg = "Are you sure you want to reset all field categories progress? This cannot be undone.";
  if(!confirm(msg)) return;
  phasesData.forEach(p=>{ 
    state.checked[p.id] = new Set(); 
    state.expanded[p.id] = new Set();
  });
  state.activePhase = 1;
  try {
    localStorage.setItem(ACTIVE_PHASE_KEY, "1");
  } catch(e) {}
  saveLastOpenedStep(null, null);
  saveProgress();
  renderAll();
}

window.clearFieldSearch = clearFieldSearch;

document.getElementById("expandToggle").addEventListener("click",()=>{
  const phase = getPhase();
  const set = state.expanded[phase.id];
  const allExpanded = set.size === phase.steps.length;
  if(allExpanded){ set.clear(); } else { phase.steps.forEach(s=>set.add(s.id)); }
  renderSteps(); renderChrome();
});
